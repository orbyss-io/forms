schema_version: "1.0"

bundle:
  id: "program-kit"
  name: "Program Kit"
  version: "0.9.10"
  role: "architecture-governed-development"
  description: "Bootstraps constitution-first, modular, vertically sliced Spec Kit repositories from an initial design."
  author: "Orbyss"
  license: "MIT"

requires:
  speckit_version: ">=1.0.1,<2.0.0"

provides:
  extensions:
    - id: "program-kit-governance"
      version: "0.9.10"
    - id: "program-kit-dotnet"
      version: "0.9.10"
  presets:
    - id: "program-kit-governance-preset"
      version: "0.9.10"
      priority: 10
      strategy: "append"
  workflows:
    - id: "program-kit-bootstrap"
      version: "0.9.10"

tags:
  - "architecture"
  - "adr"
  - "governance"
  - "bootstrap"
  - "spec-driven-development"
  - "vertical-slicing"
  - "modularity"
