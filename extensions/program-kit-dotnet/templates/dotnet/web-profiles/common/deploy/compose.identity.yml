name: program-kit-identity

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    command: [ "start-dev", "--import-realm", "--health-enabled=true" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-bootstrap-admin-only
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./keycloak/program-kit-realm.json:/opt/keycloak/data/import/program-kit-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      program-kit-local:
        aliases:
          - program-kit-identity

networks:
  program-kit-local:
    name: program-kit-local
