schema_version: "1.0"

extension:
  id: "program-kit-governance"
  name: "Program Kit Governance"
  version: "0.9.9"
  description: "Ratifies governance and enforces modular, architecture-aware Spec Kit delivery."
  author: "Orbyss"
  repository: "https://github.com/orbyss-io/program-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.0.1,<2.0.0"

provides:
  commands:
    - name: "speckit.program-kit-governance.bootstrap"
      file: "commands/speckit.program-kit-governance.bootstrap.md"
      description: "Display the normal-shell command and enforce the Codex agent orchestration boundary."
    - name: "speckit.program-kit-governance.normalize-design"
      file: "commands/speckit.program-kit-governance.normalize-design.md"
      description: "Normalize the initial design into a compact provenance-bound bootstrap brief."
    - name: "speckit.program-kit-governance.intake"
      file: "commands/speckit.program-kit-governance.intake.md"
      description: "Inventory an initial design and create the bootstrap assessment."
    - name: "speckit.program-kit-governance.research"
      file: "commands/speckit.program-kit-governance.research.md"
      description: "Research current tools and validate generic guidance against project context."
    - name: "speckit.program-kit-governance.constitution-begin"
      file: "commands/speckit.program-kit-governance.constitution-begin.md"
      description: "Revoke stale ratification evidence before constitution drafting."
    - name: "speckit.program-kit-governance.constitution-ratify"
      file: "commands/speckit.program-kit-governance.constitution-ratify.md"
      description: "Validate and hash-bind constitution ratification after the human gate."
    - name: "speckit.program-kit-governance.constitution-review"
      file: "commands/speckit.program-kit-governance.constitution-review.md"
      description: "Validate a drafted constitution and regenerate its current human review packet."
    - name: "speckit.program-kit-governance.architecture"
      file: "commands/speckit.program-kit-governance.architecture.md"
      description: "Create or update the architecture baseline and ADR system."
    - name: "speckit.program-kit-governance.tooling"
      file: "commands/speckit.program-kit-governance.tooling.md"
      description: "Create a context-sensitive tooling and quality-gate proposal."
    - name: "speckit.program-kit-governance.roadmap"
      file: "commands/speckit.program-kit-governance.roadmap.md"
      description: "Create the governed portfolio of candidate feature specifications."
    - name: "speckit.program-kit-governance.readiness"
      file: "commands/speckit.program-kit-governance.readiness.md"
      description: "Evaluate whether architecture bootstrap is ready for specifications."
    - name: "speckit.program-kit-governance.architecture-check"
      file: "commands/speckit.program-kit-governance.architecture-check.md"
      description: "Check a specification, plan, or implementation for architecture and ADR drift."
    - name: "speckit.program-kit-governance.implementation-check"
      file: "commands/speckit.program-kit-governance.implementation-check.md"
      description: "Apply programming and lifecycle guardrails before implementation."
  config:
    - name: "program-kit-governance-config.yml"
      template: "config/program-kit.template.yml"
      description: "Project-relative locations used to validate ratification, ADRs, and roadmap state."
      required: false

hooks:
  before_constitution:
    command: "speckit.program-kit-governance.constitution-begin"
    priority: 5
    optional: false
    description: "Revoke existing ratification before any constitution draft or amendment."
  after_constitution:
    command: "speckit.program-kit-governance.constitution-review"
    priority: 5
    optional: false
    description: "Validate the current constitution draft and regenerate its review packet before ratification."
  before_specify:
    command: "speckit.program-kit-governance.architecture-check"
    priority: 5
    optional: false
    description: "Require a ratified constitution and a Ready specification-roadmap entry before feature specification."
  after_specify:
    - command: "speckit.clarify"
      priority: 5
      enabled: true
      optional: false
      condition: null
      description: "Resolve material specification ambiguity; pause for answers and resume before later hooks."
    - command: "speckit.program-kit-governance.architecture-check"
      priority: 10
      enabled: true
      optional: false
      condition: null
      description: "Refuse clarified specifications that conflict with accepted architecture or conceal new decisions."
  after_plan:
    command: "speckit.program-kit-governance.architecture-check"
    priority: 5
    optional: false
    description: "Refuse plans that conflict with accepted architecture or unapproved technology choices."
  after_tasks:
    - command: "speckit.analyze"
      priority: 5
      enabled: true
      optional: false
      condition: null
      description: "Analyze the current specification, plan, and tasks after successful task generation."
    - command: "speckit.program-kit-governance.architecture-check"
      priority: 10
      enabled: true
      optional: false
      condition: null
      description: "Hash-bind analysis evidence and detect task decomposition, path, ownership, or architecture drift."
  before_implement:
    command: "speckit.program-kit-governance.implementation-check"
    priority: 5
    optional: false
    description: "Verify programming, lifecycle, testing, and architecture guardrails before implementation."
  after_implement:
    command: "speckit.program-kit-governance.architecture-check"
    priority: 5
    optional: false
    description: "Detect implementation drift and require architecture/ADR updates when choices changed."

tags:
  - "architecture"
  - "adr"
  - "governance"
  - "quality"
  - "bootstrap"
  - "vertical-slicing"
  - "modularity"
