schema_version: "1.0"

workflow:
  id: "program-kit-first-slice-acceptance"
  name: "Program Kit First Slice Acceptance"
  version: "1.0.0"
  author: "Orbyss"
  description: "Exercises the complete Spec Kit lifecycle for the first Ready roadmap slice after bootstrap."

requires:
  speckit_version: ">=1.0.1,<2.0.0"

inputs:
  integration:
    type: string
    default: "auto"
  feature_description:
    type: string
    required: true

steps:
  - id: specify-first-slice
    type: command
    command: "speckit.specify"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.feature_description }}"

  - id: plan-first-slice
    type: command
    command: "speckit.plan"
    integration: "{{ inputs.integration }}"
    input:
      args: "Plan the current feature from its specification and approved Program Kit architecture. Preserve the explicitly accepted standard-library unittest/subprocess and local aggregate-gate choices; do not reopen them as an ADR or invent CI. Include the exact mandatory Architecture Realization fields."

  - id: tasks-first-slice
    type: command
    command: "speckit.tasks"
    integration: "{{ inputs.integration }}"
    input:
      args: "Generate the complete task sequence for the current feature and its independently verifiable outcome. Include the exact mandatory Governance Completion Evidence heading, Roadmap transition field, and Path and ownership protection field. Do not add an ADR, CI, or runtime-install prerequisite for choices already accepted by the confirmed bootstrap intake."

  - id: implement-first-slice
    type: command
    command: "speckit.implement"
    integration: "{{ inputs.integration }}"
    input:
      args: "Implement and verify every source and test task for the current feature. A worker-sandbox inability to execute the host's Python 3.13 installation must not block authoring the complete source and tests; use an accessible Python 3.x only for provisional feedback and leave exact Python 3.13 verification to the independent live harness. Do not invent a new ADR, CI gate, or custom toolchain prerequisite."
