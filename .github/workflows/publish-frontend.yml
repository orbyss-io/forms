name: Publish Program Kit Frontend Packages

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: frontend-packages-production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up pinned frontend Node and GitHub Packages authentication
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          registry-url: https://npm.pkg.github.com
          scope: "@orbyss-io"

      - name: Set up pinned frontend npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund

      - name: Verify release and package metadata
        run: python tests/validate_frontend_publication.py --tag "$GITHUB_REF_NAME"

      - name: Build and test exact locked frontend family
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        working-directory: src/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test --ignore-scripts --no-audit --no-fund

      - name: Pack immutable frontend artifacts
        working-directory: src/typescript
        run: |
          mkdir -p ../../artifacts/npm
          npm pack --workspaces --pack-destination ../../artifacts/npm --ignore-scripts --json > ../../artifacts/npm/pack.json

      - name: Attest frontend artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/npm/*.tgz

      - name: Publish frontend family to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/npm/*.tgz)
          [[ ${#packages[@]} -eq 12 ]] || { echo "Expected 12 frontend packages, found ${#packages[@]}." >&2; exit 1; }
          for package in "${packages[@]}"; do
            npm publish "$package" \
              --registry=https://npm.pkg.github.com \
              --access=public \
              --tag=preview
          done

      - name: Verify clean GitHub Packages installation
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\r\n' < RUNTIME_VERSION)"
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init --yes >/dev/null
          mapfile -t names < <(python "$GITHUB_WORKSPACE/tests/validate_frontend_publication.py" --print-package-names)
          specs=()
          for name in "${names[@]}"; do specs+=("${name}@${version}"); done
          npm install "${specs[@]}" --ignore-scripts --no-audit --no-fund
