name: .NET Runtime CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Validate runtime version coherence
        run: python tests/validate_dotnet_runtime.py

      - name: Validate provider-neutral authentication boundaries
        run: python tests/validate_authentication_provider_boundary.py

      - name: Validate exact JavaScript toolchain execution
        run: python tests/validate_js_toolchain.py

      - name: Validate managed build and restricted-profile restore contract
        run: python tests/validate_dotnet_build_contract.py

      - name: Validate solution test-project discovery
        run: python tests/validate_dotnet_test_discovery.py

      - name: Restore
        run: dotnet restore ProgramKit.slnx --locked-mode --configfile NuGet.config

      - name: Restore representative consumer dependency graph
        run: python tests/validate_dotnet_consumer_restore.py

      - name: Build
        run: dotnet build ProgramKit.slnx -c Release --no-restore

      - name: Validate forms and localization semantic contracts
        run: python tests/validate_forms_localization_contracts.py

      - name: Validate form operational capabilities
        run: python tests/validate_forms_operations.py

      - name: Validate Forms management and shared MCP composition
        run: python tests/validate_forms_management.py

      - name: Validate in-memory Forms and Localization persistence
        run: python tests/validate_inmemory_storage.py

      - name: Validate BFF OIDC cookie policy
        run: python tests/validate_bff_cookie_options.py

      - name: Validate provider-neutral authentication assurance
        run: python tests/validate_assurance.py

      - name: Validate provider-neutral OAuth client credentials
        run: python tests/validate_client_credentials.py

      - name: Validate provider-neutral OAuth token exchange
        run: python tests/validate_token_exchange.py

      - name: Validate provider-neutral authenticated downstream APIs
        run: python tests/validate_downstream_api.py

      - name: Validate provider-neutral DPoP enforcement
        run: python tests/validate_dpop.py

      - name: Validate provider-neutral discovery and JWKS rollover
        run: python tests/validate_jwks_rotation.py

      - name: Validate Keycloak Admin REST adapter boundaries
        run: python tests/validate_keycloak_admin.py

      - name: Validate shell-owned public discovery endpoints
        run: python tests/validate_web_discovery.py

      - name: Import generated realms into pinned Keycloak
        run: python tests/validate_keycloak_realm_import.py

      - name: Validate Program Kit analyzer policies
        run: python tests/validate_analyzer.py

      - name: Pack Program Kit NuGet packages
        run: dotnet pack ProgramKit.slnx -c Release --no-build -p:PackageOutputPath="$PWD/artifacts/nuget"

      - name: Validate packaged BFF identity journeys in a real browser
        run: python tests/validate_bff_browser_flow.py

      - name: Validate packaged SPA-PKCE identity journeys in a real browser
        run: python tests/validate_spa_browser_flow.py

      - name: Start host with a newly packed consumer feature
        run: python tests/validate_dotnet_feature_host.py

      - name: Validate composed OpenAPI producer and client pipeline
        run: python tests/validate_openapi_exporter.py

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: program-kit-nuget-${{ github.sha }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 14
