name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/publish-frontend.yml"
      - "eng/ProgramKit.Version.props"
      - "extensions/program-kit-dotnet/templates/dotnet/files/eng/program-kit/js_toolchain.py"
      - "src/typescript/**"
      - "tests/fixtures/dotnet-registration-release.json"
      - "src/typescript/tests/forms-browser/**"
      - "tests/validate_forms_browser.py"
      - "tests/serve_forms_physical_acceptance.py"
      - "tests/validate_forms_physical_acceptance.py"
      - "tests/validate_forms_frontend.py"
      - "tests/validate_forms_frontend_ci.py"
      - "tests/validate_forms_frontend_packages.py"
      - "tests/validate_frontend_publication.py"
      - "scripts/Start-FormsPhysicalAcceptance.ps1"
      - "docs/forms-physical-acceptance.md"
      - "docs/templates/forms-physical-acceptance-report.md"
  pull_request:
    paths:
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/publish-frontend.yml"
      - "eng/ProgramKit.Version.props"
      - "extensions/program-kit-dotnet/templates/dotnet/files/eng/program-kit/js_toolchain.py"
      - "src/typescript/**"
      - "tests/fixtures/dotnet-registration-release.json"
      - "src/typescript/tests/forms-browser/**"
      - "tests/validate_forms_browser.py"
      - "tests/serve_forms_physical_acceptance.py"
      - "tests/validate_forms_physical_acceptance.py"
      - "tests/validate_forms_frontend.py"
      - "tests/validate_forms_frontend_ci.py"
      - "tests/validate_forms_frontend_packages.py"
      - "tests/validate_frontend_publication.py"
      - "scripts/Start-FormsPhysicalAcceptance.ps1"
      - "docs/forms-physical-acceptance.md"
      - "docs/templates/forms-physical-acceptance-report.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts and package isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up pinned frontend Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"

      - name: Set up pinned frontend npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund

      - name: Validate non-publishing frontend CI contract
        run: python tests/validate_forms_frontend_ci.py

      - name: Validate tag-only frontend publication contract
        run: python tests/validate_frontend_publication.py

      - name: Validate Forms engine runtime, AJV parity, and thin framework bindings
        run: python tests/validate_forms_frontend.py --install

      - name: Validate clean Forms frontend package installation
        run: python tests/validate_forms_frontend_packages.py

      - name: Validate physical-acceptance server and evidence contract
        run: python tests/validate_forms_physical_acceptance.py

  browser:
    name: Browser (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up pinned frontend Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"

      - name: Set up pinned frontend npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund

      - name: Install and validate ${{ matrix.engine }} device profiles
        run: python tests/validate_forms_browser.py --install --install-browser --engines ${{ matrix.engine }}

      - name: Upload ${{ matrix.engine }} evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forms-browser-${{ matrix.engine }}-${{ github.sha }}
          path: artifacts/forms-browser/
          if-no-files-found: warn
          retention-days: 14
